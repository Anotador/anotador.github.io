<style>
@font-face {
  font-family: "Atkinson Hyperlegible Next"; font-style: normal; font-weight: 400 700; font-display: swap;
  src: url("fonts/AtkinsonHyperlegibleNext-latin-ext.woff2") format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: "Atkinson Hyperlegible Next"; font-style: normal; font-weight: 400 700; font-display: swap;
  src: url("fonts/AtkinsonHyperlegibleNext-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
:root {
  color-scheme: light;
  --fundo: #eef1f4; --cartao: #ffffff; --texto: #1a1f25; --suave: #56606b; --borda: #dde2e8; --borda-forte: #c9d0d8; --caixa: #f6f8fa;
  --acento: #24578a; --acento-forte: #1b4570; --acento-texto: #ffffff; --acento-fundo: #e4edf6; --acento-fundo-forte: #c9dbee; --erro: #b3261e;
  --verde: #1d6b3c; --verde-fundo: #e6f3ea;
  --vermelho: #b3261e; --vermelho-fundo: #fbeae8;
  --amarelo: #835800; --amarelo-fundo: #fbf1d7;
  --azul: #1f5a96; --azul-fundo: #e5eef9;
  --cinza: #4b525a; --cinza-fundo: #eef1f4;
  --tinta: #000;   /* cor livre de rótulo: o texto puxa para esta tinta e fica legível no tema */
}
/* tema escuro: segue o sistema, a não ser que a pessoa escolha no botão de sol e lua (data-tema no html) */
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    color-scheme: dark;
    --fundo: #101419; --cartao: #171d24; --texto: #e4e9ee; --suave: #9aa5b1; --borda: #262f39; --borda-forte: #35404c; --caixa: #131920;
    --acento: #8ab6e2; --acento-forte: #b2d0ef; --acento-texto: #0c1520; --acento-fundo: #18283a; --acento-fundo-forte: #22405f; --erro: #f2a59c;
    --verde: #8fd4a6; --verde-fundo: #15291d;
    --vermelho: #f2a59c; --vermelho-fundo: #33191a;
    --amarelo: #eccb7c; --amarelo-fundo: #2f2611;
    --azul: #9cc4ee; --azul-fundo: #16243a;
    --cinza: #c3cad1; --cinza-fundo: #222a33;
    --tinta: #fff;
  }
}
:root[data-tema="escuro"] {
  color-scheme: dark;
  --fundo: #101419; --cartao: #171d24; --texto: #e4e9ee; --suave: #9aa5b1; --borda: #262f39; --borda-forte: #35404c; --caixa: #131920;
  --acento: #8ab6e2; --acento-forte: #b2d0ef; --acento-texto: #0c1520; --acento-fundo: #18283a; --acento-fundo-forte: #22405f; --erro: #f2a59c;
  --verde: #8fd4a6; --verde-fundo: #15291d;
  --vermelho: #f2a59c; --vermelho-fundo: #33191a;
  --amarelo: #eccb7c; --amarelo-fundo: #2f2611;
  --azul: #9cc4ee; --azul-fundo: #16243a;
  --cinza: #c3cad1; --cinza-fundo: #222a33;
  --tinta: #fff;
}
* { box-sizing: border-box; }
html { scrollbar-color: var(--borda-forte) var(--fundo); }
body { margin: 0; background: var(--fundo); color: var(--texto); caret-color: var(--acento);
  font: 16px/1.55 "Atkinson Hyperlegible Next", system-ui, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
::selection { background: var(--acento-fundo-forte); color: var(--texto); }
h1, h2 { text-wrap: balance; }
p { text-wrap: pretty; }
a { color: var(--acento); text-underline-offset: 3px; }
code { font: 0.92em ui-monospace, "Cascadia Mono", Menlo, monospace; }
.ic { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
[hidden] { display: none !important; }

/* topo */
.topo { position: sticky; top: 0; z-index: 3; background: var(--fundo); border-bottom: 1px solid var(--borda); padding: 10px 16px; }
.topo-linha { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 8px 18px; flex-wrap: wrap; }
.marca { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.marca img { width: 30px; height: 30px; border-radius: 8px; display: block; }
.marca-btn { all: unset; display: flex; align-items: center; gap: 10px; cursor: pointer; border-radius: 8px; }
.marca-btn:hover { color: var(--acento-forte); }
.marca-btn:focus-visible { outline: 2px solid var(--acento); outline-offset: 3px; }
.contexto { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 15px; }
.contexto .ic { color: var(--suave); }
#ctx-arquivo { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 36ch; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; background: var(--acento-fundo); color: var(--acento-forte); font-size: 13.5px; font-weight: 700; white-space: nowrap; }
.chip .ic { color: inherit; }
.topo-direita { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.progresso { font-size: 14.5px; color: var(--suave); font-variant-numeric: tabular-nums; margin-right: 10px; white-space: nowrap; }
.progresso strong { color: var(--texto); }
.discreto { background: transparent; border: 1px solid transparent; color: var(--suave); padding: 6px 10px; font-size: 14.5px; font-weight: 600; text-decoration: none; border-radius: 8px; display: inline-flex; gap: 7px; align-items: center; cursor: pointer; }
.discreto:hover { color: var(--texto); border-color: var(--borda-forte); }
.barra { max-width: 1200px; margin: 10px auto 0; height: 5px; border-radius: 3px; background: var(--borda); overflow: hidden; }
.barra > div { height: 100%; width: 0; background: var(--acento); transition: width .25s ease; }

main { max-width: 1200px; margin: 0 auto; padding: 22px 16px 48px; }
.cartao { background: var(--cartao); border: 1px solid var(--borda); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
.cartao h2 { display: flex; align-items: center; gap: 9px; font-size: 17.5px; margin: 0 0 6px; }
.cartao h2 .ic { color: var(--acento); width: 20px; height: 20px; }
.dica { color: var(--suave); font-size: 14.5px; margin: 0 0 14px; }
.erro { color: var(--erro); font-weight: 600; margin: 12px 0 0; }
.rotulo { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--suave); margin: 0 0 6px; }

button, .botao { font: inherit; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 15px;
  border-radius: 10px; border: 1px solid var(--borda-forte); background: var(--cartao); color: var(--texto); cursor: pointer; transition: border-color .15s, background-color .15s; }
button:hover, .botao:hover { border-color: var(--suave); }
button:active { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
button .ic, .botao .ic { color: var(--suave); }
.principal { background: var(--acento); border-color: var(--acento); color: var(--acento-texto); }
.principal .ic { color: inherit; }
.principal:hover { background: var(--acento-forte); border-color: var(--acento-forte); }
.pequeno { padding: 6px 10px; font-size: 14px; border-radius: 8px; }
.perigo, .perigo .ic { color: var(--erro); }
.perigo:hover { border-color: var(--erro); }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
input[type=text], input[type=number], select, textarea { font: inherit; font-size: 15px; color: var(--texto); background: var(--caixa);
  border: 1px solid var(--borda-forte); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus { border-color: var(--acento); outline: none; box-shadow: 0 0 0 3px var(--acento-fundo-forte); }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--acento); margin: 0; flex: none; }
textarea { resize: vertical; }
.botoes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* tela inicial */
.inicio { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 40px; align-items: center; min-height: calc(100vh - 170px); padding-bottom: 12px; }
.chamada { font-size: clamp(30px, 3.6vw, 44px); line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 14px; }
.chamada-texto { font-size: 18.5px; color: var(--suave); margin: 0 0 26px; max-width: 44ch; }
.fatos { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.fatos li { display: flex; gap: 13px; align-items: flex-start; font-size: 16.5px; }
.fatos li .ic { color: var(--acento); width: 21px; height: 21px; margin-top: 2px; }
.fatos li.fato-principal { background: var(--acento-fundo); border-radius: 12px; padding: 12px 14px; margin: 0 -14px 4px; }
.soltar { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 44px 24px; min-height: 320px;
  border: 2px dashed var(--borda-forte); border-radius: 18px; background: var(--cartao); cursor: pointer; text-align: center; transition: border-color .15s, background-color .15s; }
.soltar:hover, .soltar.sobre { border-color: var(--acento); background: var(--acento-fundo); }
.soltar-ic { width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; background: var(--acento-fundo); color: var(--acento); }
.soltar:hover .soltar-ic, .soltar.sobre .soltar-ic { background: var(--cartao); }
.soltar-ic .ic { width: 30px; height: 30px; }
.soltar-titulo { font-size: 20px; }
.soltar-titulo strong { color: var(--acento); }
.formatos { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.fmt { font-size: 13px; font-weight: 700; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--borda); color: var(--suave); background: var(--caixa); }
.amostra-btn { width: 100%; margin-top: 12px; }
.lista { list-style: none; margin: 0; padding: 0; }
.lista li { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--borda); }
.lista li:first-child { border-top: 0; padding-top: 0; }
.lista .nome-sessao { display: inline-flex; align-items: center; gap: 8px; }
.lista .nome-sessao .ic { color: var(--suave); }

/* configuração */
.arquivo-linha { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.arquivo-nome { display: flex; gap: 12px; align-items: center; min-width: 0; }
.arquivo-ic { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; background: var(--acento-fundo); color: var(--acento); flex: none; }
.arquivo-ic .ic { width: 22px; height: 22px; }
.arquivo-nome strong { font-size: 17px; overflow-wrap: anywhere; }
.arquivo-nome .dica { margin: 2px 0 0; }
#cfg-planilha-caixa { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--borda); max-width: 32rem; }
.campo-linha { display: grid; grid-template-columns: 1.6rem minmax(150px, 1fr) minmax(140px, 1fr) minmax(0, 2fr) 5rem; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--borda); }
.campo-linha.cabeca { border-top: 0; font-size: 13.5px; font-weight: 700; color: var(--suave); padding: 0 0 4px; }
.campo-linha label { display: flex; gap: 10px; align-items: center; min-width: 0; cursor: pointer; }
.campo-linha code { font-size: 14px; overflow-wrap: anywhere; }
.campo-linha.escondida code, .campo-linha.escondida .amostra { opacity: .55; }
.amostra { color: var(--suave); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.setas { display: flex; gap: 4px; justify-content: flex-end; }
.setas button { padding: 5px 7px; }
.opcoes-tela { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: flex-end; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--borda); }
.opcoes-tela > div { flex: 0 1 22rem; }
.marca-opcao { display: flex; gap: 9px; align-items: center; cursor: pointer; padding: 9px 0; font-weight: 600; }
.marca-opcao .ic { color: var(--suave); }
.modelo { max-width: 26rem; margin: 2px 0 16px; }
.opcao-cfg { border: 1px solid var(--borda); border-radius: 12px; padding: 10px 12px; margin-top: 10px; background: var(--caixa); }
.opcao-cfg .l1 { display: grid; grid-template-columns: auto minmax(0, 1fr) 4.2rem auto auto; gap: 10px; align-items: center; }
.opcao-cfg input.tecla { text-align: center; text-transform: uppercase; font-weight: 700; }
.opcao-cfg input.desc { margin-top: 8px; font-size: 14px; }
.cores { display: flex; gap: 7px; align-items: center; }
button.amostra-cor { width: 24px; height: 24px; padding: 0; border-radius: 50%; border: 0; background: var(--c); flex: none; }
button.amostra-cor[aria-pressed=true] { box-shadow: 0 0 0 2px var(--caixa), 0 0 0 4px var(--c); }
input[type=color].cor-livre { width: 34px; height: 30px; padding: 2px; border: 1px solid var(--borda-forte); border-radius: 8px; background: var(--cartao); cursor: pointer; flex: none; }
input[type=text].hex { width: 6.6rem; font-family: ui-monospace, "Cascadia Mono", Menlo, monospace; font-size: 14px; }
button.alca { padding: 4px; border: 0; background: transparent; cursor: grab; touch-action: none; }
button.alca .ic { color: var(--suave); }
button.alca:active { cursor: grabbing; }
.arrastando { opacity: .45; }
.alvo-acima { box-shadow: 0 -3px 0 0 var(--acento); }
.alvo-abaixo { box-shadow: 0 3px 0 0 var(--acento); }
.coluna-rotulo { max-width: 22rem; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--borda); }
.erro-campo { margin: 8px 0 0; font-size: 14px; }
input[aria-invalid=true], button[aria-invalid=true] { border-color: var(--erro); box-shadow: 0 0 0 3px color-mix(in srgb, var(--erro) 22%, transparent); }
:where(input, select, textarea, button) { scroll-margin-top: 96px; }
.instrucoes { padding: 14px 20px; }
.instrucoes summary { cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.instrucoes summary .ic { color: var(--acento); }
.instrucoes .pre, .instrucoes-texto { white-space: pre-wrap; margin: 10px 0 2px; }
#an-campos.lado { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 0 18px; align-items: start; }
[data-cor=verde] { --c: var(--verde); --cf: var(--verde-fundo); }
[data-cor=vermelho] { --c: var(--vermelho); --cf: var(--vermelho-fundo); }
[data-cor=amarelo] { --c: var(--amarelo); --cf: var(--amarelo-fundo); }
[data-cor=azul] { --c: var(--azul); --cf: var(--azul-fundo); }
[data-cor=cinza] { --c: var(--cinza); --cf: var(--cinza-fundo); }
.comecar-linha { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: end; }
.comecar-linha .principal { padding: 11px 20px; font-size: 16px; }
.mais { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--borda); }
.mais .dica { margin: 0; flex: 1 1 22rem; }

/* anotar */
.item { padding: 18px 22px 20px; }
.topo-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--suave); font-size: 14.5px; font-variant-numeric: tabular-nums; }
.id-item { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; }
.campo { margin-top: 14px; }
.campo-nome { font-size: 14px; font-weight: 700; color: var(--suave); margin: 0 0 6px; }
.texto { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--caixa); border: 1px solid var(--borda); border-radius: 10px; padding: 12px 14px; max-height: 46vh; overflow: auto; font-size: 16.5px; line-height: 1.6; }
.texto.json { font: 14px/1.5 ui-monospace, "Cascadia Mono", Menlo, monospace; }
.texto.vazio { color: var(--suave); font-style: italic; }
.turno { border-left: 3px solid var(--borda-forte); padding: 2px 0 2px 12px; margin: 0 0 12px; }
.turno:last-child { margin-bottom: 0; }
.turno.usuario { border-left-color: var(--acento); }
.turno-papel { font-size: 13px; font-weight: 700; color: var(--suave); }
.rotular { margin-top: 20px; }
.opcoes { display: flex; flex-wrap: wrap; gap: 10px; }
.opcao { flex: 1 1 150px; max-width: 280px; justify-content: flex-start; gap: 10px; padding: 12px 14px; border-radius: 12px; font-size: 16.5px; font-weight: 700;
  color: var(--c); background: var(--cf); border: 1.5px solid color-mix(in srgb, var(--c) 55%, transparent); }
.opcao:hover { border-color: var(--c); }
.opcao kbd { background: transparent; border-color: currentColor; color: inherit; }
.opcao .ic { color: inherit; margin-left: auto; visibility: hidden; }
.opcao[aria-pressed=true] { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 35%, transparent); }
.opcao[aria-pressed=true] .ic { visibility: visible; }
.opcao[data-cor=hex] { --cf: color-mix(in srgb, var(--c) 14%, var(--cartao)); color: color-mix(in srgb, var(--c) 72%, var(--tinta)); }
.opcao .txt { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 1px; min-width: 0; }
.opcao .txt small { font-weight: 500; font-size: 13px; opacity: .85; }
.video video { display: block; width: 100%; height: auto; border-radius: 10px; background: #000; }
.video-caixa { position: relative; }
button.video-play { position: absolute; inset: 0; margin: auto; width: max-content; height: max-content; gap: 10px; padding: 14px 24px; font-size: 18px;
  color: #fff; background: rgba(10, 17, 25, .78); border: 1px solid rgba(255, 255, 255, .25); border-radius: 999px; }
button.video-play:hover { background: rgba(10, 17, 25, .9); border-color: rgba(255, 255, 255, .5); }
button.video-play .ic { color: #fff; width: 26px; height: 26px; }
#video-demo { scroll-margin-top: 90px; }
.link-video { display: inline-flex; align-items: center; gap: 7px; margin-top: 14px; font-weight: 600; text-decoration: none; }
.link-video:hover { text-decoration: underline; }
#an-nota { margin-top: 12px; }
.nav { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--borda); }
.atalhos { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; color: var(--suave); font-size: 14px; }
.atalho { display: inline-flex; gap: 6px; align-items: center; }
kbd { font: 700 12.5px/1 ui-monospace, "Cascadia Mono", Menlo, monospace; min-width: 22px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--borda-forte); border-bottom-width: 2px; background: var(--caixa); color: var(--texto); text-align: center; }
.fim h2 .ic { color: var(--verde); }
.estrela-link .ic { color: #e0a800; fill: #e0a800; }
.botao.estrela-link { text-decoration: none; }
.convite-estrela { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin-top: 18px; padding: 12px 14px; border-radius: 12px;
  background: color-mix(in srgb, #e0a800 12%, var(--cartao)); border: 1px solid color-mix(in srgb, #e0a800 35%, transparent); }
.convite-estrela > .ic { color: #e0a800; fill: #e0a800; width: 20px; height: 20px; }
.convite-estrela > span { flex: 1 1 18rem; }
.rodape { display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: center; }
.estado { display: flex; gap: 9px; align-items: flex-start; color: var(--suave); font-size: 14px; }
.estado .ic { color: var(--verde); margin-top: 2px; }
.ir { display: inline-flex; gap: 6px; align-items: center; }
.ir input { width: 6.5em; }
@media (max-width: 860px) {
  .inicio { grid-template-columns: 1fr; min-height: 0; gap: 26px; }
  .soltar { min-height: 230px; padding: 32px 18px; }
  .opcoes-tela { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .campo-linha { grid-template-columns: 1.6rem 1fr auto; }
  .campo-linha input[type=text] { grid-column: 2 / -1; grid-row: 2; }
  .campo-linha .amostra { grid-column: 2 / -1; grid-row: 3; }
  .campo-linha .setas { grid-column: 3; grid-row: 1; }
  .campo-linha.cabeca { display: none; }
  .opcao-cfg .l1 { grid-template-columns: auto minmax(0, 1fr) 3.8rem auto; }
  .opcao-cfg .cores { grid-column: 1 / -1; grid-row: 2; flex-wrap: wrap; }
  .comecar-linha { grid-template-columns: 1fr; }
  .opcao { max-width: none; flex-basis: 40%; }
  .topo-direita { margin-left: 0; width: 100%; justify-content: space-between; flex-wrap: wrap; row-gap: 4px; }
  #ir-inicio > span, #estrela > span { display: none; }   /* só o ícone no celular; o nome fica no aria-label */
  .item { padding: 16px; }
}
</style>

<script>
"use strict";
/* Anotador: rotulagem de qualquer conjunto de dados no navegador. Ícones: Lucide (ISC). Fonte: Atkinson Hyperlegible Next (OFL). */
const FONTE = "<!doctype html>\n" + document.documentElement.outerHTML;
const MARCA = '<script type="application/json" id="pacote">null</scr' + 'ipt>';
const PREF = "anotador:";
const SVGNS = "http://www.w3.org/2000/svg";
const BOM = String.fromCharCode(0xFEFF);
const SUBSTITUICAO = String.fromCharCode(0xFFFD);
const ACENTOS = new RegExp("[" + String.fromCharCode(0x300) + "-" + String.fromCharCode(0x36f) + "]", "g");
const CORES = ["verde", "vermelho", "amarelo", "azul", "cinza"];
const EXTENSOES = ["xlsx", "xlsm", "csv", "tsv", "txt", "json", "jsonl", "ndjson"];
/* cor das bolinhas de cada cor pronta (o botão do rótulo usa a variante do tema) e a inicial do campo hexadecimal */
const NOMEADAS = { verde: "#22a05a", vermelho: "#d93025", amarelo: "#e0a800", azul: "#2f74c0", cinza: "#8a939c" };
function normHex(s) {
  const m = String(s || "").trim().match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i);
  if (!m) return null;

/* leva a tela até o campo com problema, marca a borda e repete a mensagem embaixo dele até a pessoa mexer ali */
function focarErro(msg) {

  const alvo = campoErro;

/* arrastar pela alça, ou setas do teclado com a alça em foco, reordena a lista e redesenha */
function ordenavel(caixa, seletor, lista, aoMudar) {
  const linhas = [...caixa.querySelectorAll(seletor)];
  let de = null;
  const limpar = () => linhas.forEach(l => l.classList.remove("alvo-acima", "alvo-abaixo", "arrastando"));
  const mover = (a, b) => {
    if (b < 0 || b >= lista.length || a === b) return;
    const [x] = lista.splice(a, 1);
    lista.splice(b, 0, x);
    aoMudar();
    const alca = caixa.querySelectorAll(seletor)[b];
    if (alca && alca.querySelector(".alca")) alca.querySelector(".alca").focus();
  };
  linhas.forEach((linha, i) => {
    const alca = linha.querySelector(".alca");
    alca.addEventListener("pointerdown", () => { linha.draggable = true; });
    alca.addEventListener("pointerup", () => { linha.draggable = false; });
    alca.addEventListener("keydown", e => {
      if (e.key === "ArrowUp") { e.preventDefault(); mover(i, i - 1); }
      else if (e.key === "ArrowDown") { e.preventDefault(); mover(i, i + 1); }
    });
    linha.addEventListener("dragstart", e => { de = i; linha.classList.add("arrastando"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(i)); });
    linha.addEventListener("dragend", () => { linha.draggable = false; de = null; limpar(); });
    linha.addEventListener("dragover", e => {
      if (de === null) return;
      e.preventDefault();
      const r = linha.getBoundingClientRect(), acima = e.clientY < r.top + r.height / 2;
      linha.classList.toggle("alvo-acima", acima);
      linha.classList.toggle("alvo-abaixo", !acima);
    });
    linha.addEventListener("dragleave", () => linha.classList.remove("alvo-acima", "alvo-abaixo"));
    linha.addEventListener("drop", e => {
      if (de === null) return;
      e.preventDefault();
      const r = linha.getBoundingClientRect();
      let para = e.clientY < r.top + r.height / 2 ? i : i + 1;
      if (de < para) para--;
      const origem = de;
      de = null; limpar();
      mover(origem, para);
    });
  });
}

async function abrirArquivo(file) {
  mostrarErro("erro-carregar", "");
  try {
    const buf = await file.arrayBuffer();
    const u8 = new Uint8Array(buf);
    const ext = extensao(file.name);
    const zip = u8.length > 4 && u8[0] === 0x50 && u8[1] === 0x4B && u8[2] === 3 && u8[3] === 4;
    if (ext === "xls" && !zip) throw new Error(t("xls"));
    /* imagem, PDF, documento ou qualquer binário não é tabela: antes, uma imagem virava itens de lixo */
    if (ext && !EXTENSOES.includes(ext)) throw new Error(t("naoTabela"));
    if (!zip && pareceBinario(u8)) throw new Error(t("naoTabela"));
    if (zip) {
      const planilhas = [];
      for (const p of await deXLSX(buf)) {
        try { planilhas.push(Object.assign({ nome: p.nome }, deMatriz(p.matriz, "xlsx", null))); } catch (e) { /* planilha vazia ou só cabeçalho */ }
      }
      if (!planilhas.length) throw new Error(t("xlsxSemPlanilha"));
      S = { arquivo: file.name, hash: cyrb53(u8), pacote: false, formato: "xlsx", delim: null, planilhas };
      usarPlanilha(0);
      telaConfig();
    } else {
      const texto = decodificar(buf);
      const d = interpretar(file.name, texto);
      if (!d.linhas.length) throw new Error(t("semItens"));
      if (!d.colunas.length) throw new Error(t("semColunas"));
      abrirDados(d, { arquivo: file.name, hash: cyrb53(texto) });
    }
  } catch (e) {
    S = null;
    mostrarErro("erro-carregar", t("erroAbrir", file.name, e.message));
  }
}

const idDe = i => C().idColuna ? String(S.linhas[i][C().idColuna]) : String(i + 1);

function contarFeitos() { let n = 0; for (const id of sessao.ordem) if (completo(id)) n++; return n; }
function primeiraSemResposta(de) {
  const N = sessao.ordem.length;
  for (let k = 0; k < N; k++) { const p = (de + k) % N; if (!completo(sessao.ordem[p])) return p; }
  return N;
}
function ajustarSessao() {
  sessao.respostas = sessao.respostas || {};
  sessao.tempo = sessao.tempo || {};
  if (typeof sessao.idColuna === "string" && sessao.idColuna !== C().idColuna && Object.keys(sessao.respostas).length
      && (sessao.idColuna === "" || (S.colunas.includes(sessao.idColuna) && idsUnicos(S, sessao.idColuna)))) {
    C().idColuna = sessao.idColuna;
  }
  sessao.idColuna = C().idColuna;
  const ids = S.linhas.map((_, i) => idDe(i));
  indice = new Map(ids.map((id, i) => [id, i]));
  if (!Array.isArray(sessao.ordem) || sessao.aleatorio !== C().aleatorio) {
    sessao.semente = sessao.semente || novaSemente();
    sessao.ordem = C().aleatorio ? embaralhar(ids, sessao.semente) : ids;
    sessao.aleatorio = C().aleatorio;
    sessao.pos = primeiraSemResposta(0);
  } else {
    const ordem = sessao.ordem.filter(id => indice.has(id)), tem = new Set(ordem);
    for (const id of ids) if (!tem.has(id)) ordem.push(id);
    sessao.ordem = ordem;
  }
  sessao.pos = clamp(sessao.pos | 0, 0, sessao.ordem.length);

function pararRelogio() {
  const id = itemAtual();
  if (marca === null || !id) { marca = null; return; }
  sessao.tempo[id] = Math.round(((sessao.tempo[id] || 0) + (performance.now() - marca) / 1000) * 10) / 10;
  marca = null;
}
function iniciarRelogio() { marca = (itemAtual() && !document.hidden) ? performance.now() : null; }

function telaAnotar() {
  mostrarTela("anotar");
  $("an-opcoes").replaceChildren(...C().opcoes.map(o => {
    const livre = !CORES.includes(o.cor);   // cor em hexadecimal: o tom do texto e do fundo sai dela, no tema
    return el("button", { type: "button", className: "opcao", "data-cor": livre ? "hex" : o.cor, style: livre ? `--c:${o.cor}` : null,
      "data-nome": o.nome, "aria-pressed": "false", onclick: () => responder(o.nome) },
      o.tecla ? el("kbd", { textContent: o.tecla.toUpperCase() }) : null,
      el("span", { className: "txt" }, el("span", { textContent: o.nome }), o.desc ? el("small", { textContent: o.desc }) : null),
      ic("check"));
  }));
  $("an-instrucoes").hidden = !C().instrucoes.trim();
  $("an-instrucoes-texto").textContent = C().instrucoes;
  $("an-atalhos").replaceChildren(
    ...C().opcoes.filter(o => o.tecla).map(o => el("span", { className: "atalho" }, el("kbd", { textContent: o.tecla.toUpperCase() }), o.nome.toLowerCase())),
    el("span", { className: "atalho" }, el("kbd", { textContent: "←" }), el("kbd", { textContent: "→" }), t("navegam")));
  $("an-nota").hidden = !C().notas;
  $("ir-config").querySelector("span").textContent = S.pacote ? t("trocarAnotador") : t("configuracao");
  usarIcone($("ir-config").querySelector("svg"), S.pacote ? "user" : "settings-2");
  $("ir-num").max = sessao.ordem.length;
  $("ultimo").textContent = t("anotandoComo", anotador);
  renderAnotar();
}

function renderValor(v) {
  if (typeof v === "string") {
    const s = v.trim();
    if ((s[0] === "[" || s[0] === "{") && s.length < 3e6) { try { v = JSON.parse(s); } catch (e) {} }
  }
  if (v === undefined || v === null || v === "") return el("div", { className: "texto vazio", textContent: t("vazio") });
  if (Array.isArray(v) && v.length && v.every(x => x && typeof x === "object" && ("role" in x || "from" in x || "speaker" in x) && ("content" in x || "text" in x || "value" in x))) {
    return el("div", { className: "texto" }, ...v.map(x => {
      const papel = String(x.role ?? x.from ?? x.speaker);
      let conteudo = x.content ?? x.text ?? x.value;
      if (Array.isArray(conteudo)) conteudo = conteudo.map(p => (p && typeof p === "object") ? (p.text ?? JSON.stringify(p)) : String(p)).join("\n");
      else if (conteudo && typeof conteudo === "object") conteudo = JSON.stringify(conteudo, null, 2);
      const usuario = /^(user|human|usuario|usuário)$/i.test(papel);
      return el("div", { className: "turno" + (usuario ? " usuario" : "") }, el("div", { className: "turno-papel", textContent: papel }), el("div", { textContent: String(conteudo ?? "") }));
    }));
  }
  if (typeof v === "object") return el("div", { className: "texto json", textContent: JSON.stringify(v, null, 2) });
  return el("div", { className: "texto", textContent: String(v) });
}

function renderAnotar() {
  const N = sessao.ordem.length, feitos = contarFeitos();
  $("progresso").innerHTML = t("respondidos", feitos, N);
  $("barra").style.width = (N ? feitos / N * 100 : 0) + "%";
  if (sessao.pos >= N) {
    $("an-item").hidden = true; $("an-fim").hidden = false;
    $("fim-titulo").textContent = feitos === N ? t("fimTudo") : t("fimLista");
    $("fim-texto").textContent = feitos === N ? t("fimTextoTudo", N) : t("fimTextoParcial", feitos, N);
    $("fim-pular").hidden = feitos === N;
    marca = null;
    return;
  }
  $("an-item").hidden = false; $("an-fim").hidden = true;
  const id = sessao.ordem[sessao.pos];
  const linha = S.linhas[indice.get(id)];
  $("an-id").textContent = rotuloItem(id);
  $("an-pos").textContent = t("posDe", sessao.pos + 1, N);
  $("an-campos").replaceChildren(...C().campos.filter(c => c.mostrar).map(c => el("div", { className: "campo" },
    el("div", { className: "campo-nome", textContent: c.nome || c.coluna }), renderValor(linha[c.coluna]))));
  $("an-campos").classList.toggle("lado", !!C().lado);
  atualizarBotoes(id);
  $("an-nota").value = (sessao.respostas[id] && sessao.respostas[id].nota) || "";
  $("an-anterior").disabled = sessao.pos === 0;
  iniciarRelogio();
}

function atualizarBotoes(id) {
  const r = sessao.respostas[id];
  for (const b of document.querySelectorAll("#an-opcoes .opcao")) b.setAttribute("aria-pressed", String(!!r && r.rotulo === b.dataset.nome));
}

function irPara(p) {
  pararRelogio();
  sessao.pos = clamp(p, 0, sessao.ordem.length);
  const ativo = document.activeElement;
  if (ativo && ativo.classList && (ativo.classList.contains("opcao") || ativo.id === "an-nota")) ativo.blur();
  salvar();
  renderAnotar();
  window.scrollTo(0, 0);
}

function responder(rotulo) {
  const id = itemAtual();
  if (!id) return;
  sessao.respostas[id] = Object.assign({}, sessao.respostas[id], { rotulo, quando: new Date().toISOString() });
  $("ultimo").textContent = t("ultimo", rotuloItem(id), rotulo);
  if (C().avancar === false) { pararRelogio(); salvar(); renderAnotar(); }   // fica no item; as setas levam adiante
  else irPara(sessao.pos + 1);
}

/* ---------- saídas ---------- */
function campoCSV(v, d) {
  if (v === undefined || v === null) return "";
  let s = typeof v === "object" ? JSON.stringify(v) : String(v);
  if (s.includes('"') || s.includes(d) || /[\r\n]/.test(s) || /^\s|\s$/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function baixarCSV() {
  if (marca !== null) { pararRelogio(); iniciarRelogio(); }
  salvar();
  const d = S.delim === ";" ? ";" : ",";
  const usadas = new Set(S.colunas);
  const nova = n => { let x = n; while (usadas.has(x)) x += "_new"; usadas.add(x); return x; };
  const notas = C().notas;
  const cab = [...S.colunas, nova(C().colunaRotulo || SAIDA.rotulo), ...(notas ? [nova(SAIDA.nota)] : []), nova(SAIDA.segundos), nova(SAIDA.anotador), nova(SAIDA.quando)];
  const saida = [cab.map(c => campoCSV(c, d)).join(d)];
  S.linhas.forEach((l, i) => {
    const id = idDe(i), r = sessao.respostas[id] || {};
    const vals = [...S.colunas.map(c => l[c]), r.rotulo || "", ...(notas ? [r.nota || ""] : []), sessao.tempo[id] ?? "", (r.rotulo || r.nota) ? anotador : "", r.quando || ""];
    saida.push(vals.map(v => campoCSV(v, d)).join(d));
  });
  baixar(BOM + saida.join("\r\n") + "\r\n", `${baseNome()}-labeled-${slug(anotador)}.csv`, "text/csv;charset=utf-8");
}
function baixarProgresso() {
  if (marca !== null) { pararRelogio(); iniciarRelogio(); }
  salvar();
  const v = { formato: "anotador-progresso", versao: 3, arquivo: S.arquivo, planilha: S.planilha || null, hash: S.hash, anotador, exportado: new Date().toISOString(), config: C(), sessao };
  baixar(JSON.stringify(v, null, 1), `${baseNome()}-progress-${slug(anotador)}.json`, "application/json");
}
async function importarProgresso(file) {
  let v;
  try { v = JSON.parse(await file.text()); } catch (e) { alert(t("importarInvalido")); return; }
  if (!v || v.formato !== "anotador-progresso" || !v.sessao) { alert(t("importarInvalido")); return; }
  const outro = v.hash !== S.hash || (v.planilha || null) !== (S.planilha || null);
  if (outro && !confirm(t("importarOutro", v.arquivo + (v.planilha ? ` (${v.planilha === "*" ? t("todasPlanilhas") : v.planilha})` : "")))) return;
  const nome = String(v.anotador || anotador || "anotador");
  const ja = lerLS(PREF + S.base + ":" + norm(nome));
  if (ja && ja.sessao && ja.feitos > 0 && !confirm(t("importarTrocar", nome, ja.feitos))) return;
  if (!S.pacote && v.config) S.config = mesclarConfig(v.config);
  anotador = nome;
  lembrarNome(nome);
  sessao = v.sessao;
  ajustarSessao();
  salvar();
  telaAnotar();
}
function gerarPagina() {
  const err = validar();
  if (err) { mostrarErro("cfg-erro", err); focarErro(err); return; }
  mostrarErro("cfg-erro", "");
  if (!FONTE.includes(MARCA)) { alert(t("jaGerada")); return; }
  const pacote = { arquivo: S.arquivo, planilha: S.planilha || null, formato: S.formato, delim: S.delim, colunas: S.colunas, linhas: S.linhas, hash: S.hash, config: C(), gerado: new Date().toISOString() };
  const json = JSON.stringify(pacote).replace(/</g, "\\u003c");
  /* o tema escolhido aqui não vai junto: quem recebe a página fica com o tema dele */
  const html = FONTE.replace(/<html([^>]*?) data-tema="[^"]*"/, "<html$1")
    .replace(MARCA, () => '<script type="application/json" id="pacote">' + json + '</scr' + 'ipt>');
  baixar(html, `anotador-${slug(baseNome())}.html`, "text/html;charset=utf-8");
}

/* ---------- eventos ---------- */
/* volta à tela inicial de qualquer tela; na página gerada para outro anotador, a inicial é a do nome */
function voltarInicio() {
  if (tela === "anotar" && sessao) { pararRelogio(); salvar(); }
  if (S && S.pacote) telaNome(); else telaCarregar();
}
$("marca").addEventListener("click", voltarInicio);
$("ir-inicio").addEventListener("click", voltarInicio);
$("idioma").addEventListener("click", trocarIdioma);
$("tema").addEventListener("click", trocarTema);
$("arquivo").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) abrirArquivo(f); });
$("amostra").addEventListener("click", abrirAmostra);
const zona = $("soltar");
for (const ev of ["dragenter", "dragover"]) document.addEventListener(ev, e => { if (tela !== "carregar") return; e.preventDefault(); zona.classList.add("sobre"); });
for (const ev of ["dragleave", "drop"]) document.addEventListener(ev, () => zona.classList.remove("sobre"));
document.addEventListener("drop", e => { if (tela !== "carregar") return; e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) abrirArquivo(f); });

$("cfg-trocar").addEventListener("click", telaCarregar);
$("cfg-planilha").addEventListener("change", e => { usarPlanilha(e.target.value === "todas" ? "todas" : +e.target.value); telaConfig(); });
$("cfg-id").addEventListener("change", e => {
  const c = e.target.value;
  if (c && !idsUnicos(S, c)) {
    $("cfg-id-aviso").textContent = t("idAviso", c);
    e.target.value = ""; C().idColuna = ""; return;
  }
  $("cfg-id-aviso").textContent = "";
  C().idColuna = c;
});
$("cfg-aleatorio").addEventListener("change", e => { C().aleatorio = e.target.checked; });
$("cfg-notas").addEventListener("change", e => { C().notas = e.target.checked; });
$("cfg-lado").addEventListener("change", e => { C().lado = e.target.checked; });
$("cfg-avancar").addEventListener("change", e => { C().avancar = e.target.checked; });
$("cfg-coluna").addEventListener("input", e => { C().colunaRotulo = e.target.value; });
$("cfg-instrucoes").addEventListener("input", e => { C().instrucoes = e.target.value; });
$("cfg-modelo").addEventListener("change", e => { if (e.target.value === "") return; C().opcoes = opcoesDe(MODELOS[+e.target.value]); renderOpcoesCfg(); });
$("cfg-mais-opcao").addEventListener("click", () => { C().opcoes.push({ nome: "", desc: "", tecla: teclaLivre(), cor: "cinza" }); renderOpcoesCfg(); });
$("cfg-comecar").addEventListener("click", () => comecar($("cfg-nome").value));
$("cfg-nome").addEventListener("keydown", e => { if (e.key === "Enter") comecar($("cfg-nome").value); });
$("cfg-gerar").addEventListener("click", gerarPagina);
$("nome-comecar").addEventListener("click", () => comecar($("nome-nome").value));
$("nome-nome").addEventListener("keydown", e => { if (e.key === "Enter") comecar($("nome-nome").value); });
for (const inp of document.querySelectorAll("input.importar")) inp.addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) importarProgresso(f); });

$("an-anterior").addEventListener("click", () => { if (sessao.pos > 0) irPara(sessao.pos - 1); });
$("an-proxima").addEventListener("click", () => irPara(sessao.pos + 1));
$("an-pular").addEventListener("click", () => irPara(primeiraSemResposta(sessao.pos + 1)));
$("an-nota").addEventListener("input", e => {
  const id = itemAtual();
  if (!id) return;
  const r = sessao.respostas[id] || (sessao.respostas[id] = {});
  r.nota = e.target.value;
  clearTimeout(tNota); tNota = setTimeout(salvar, 400);
});
$("fim-baixar").addEventListener("click", baixarCSV);
$("fim-pular").addEventListener("click", () => irPara(primeiraSemResposta(0)));
$("fim-inicio").addEventListener("click", () => irPara(0));
$("baixar-csv").addEventListener("click", baixarCSV);
$("baixar-prog").addEventListener("click", baixarProgresso);
$("ir-config").addEventListener("click", () => { pararRelogio(); salvar(); if (S.pacote) telaNome(); else telaConfig(); });
$("apagar").addEventListener("click", () => {
  if (!confirm(t("confirmApagar", anotador))) return;
  marca = null; novaSessao(); salvar(); telaAnotar();
});
const irNum = () => { const n = parseInt($("ir-num").value, 10); if (n >= 1) { irPara(Math.min(n, sessao.ordem.length) - 1); $("ir-num").value = ""; } };
$("ir-btn").addEventListener("click", irNum);
$("ir-num").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); irNum(); } });

document.addEventListener("keydown", ev => {
  if (tela !== "anotar" || !sessao) return;
  const alvo = ev.target, tag = alvo.tagName;
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") { if (ev.key === "Escape") alvo.blur(); return; }
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === "ArrowLeft") { ev.preventDefault(); if (sessao.pos > 0) irPara(sessao.pos - 1); return; }
  if (ev.key === "ArrowRight") { ev.preventDefault(); irPara(sessao.pos + 1); return; }
  const k = ev.key.toLowerCase();
  const o = C().opcoes.find(x => x.tecla && x.tecla === k);
  if (o && itemAtual()) { ev.preventDefault(); responder(o.nome); }
});
document.addEventListener("visibilitychange", () => {
  if (tela !== "anotar" || !sessao) return;
  if (document.hidden) { pararRelogio(); salvar(); } else iniciarRelogio();
});
window.addEventListener("pagehide", () => { if (tela === "anotar" && sessao) { pararRelogio(); salvar(); } });

/* o vídeo de demonstração mora em docs/: com o index.html sozinho (ou na página gerada), a seção some */
(function videoDemo() {
  const capa = new Image();
  capa.onerror = () => { $("video-demo").hidden = true; $("link-video").hidden = true; };
  capa.src = "docs/demo-poster.jpg";
})();
/* vídeo, capa e legenda no idioma da tela. A legenda fica desligada (liga no CC do player) e só entra com a
   página servida: aberta como arquivo, o navegador barra o .vtt */
/* Nada do vídeo é baixado antes do clique em Assistir: até lá só a capa troca com o idioma */
function atualizarVideo() {
  const v = $("video-demo").querySelector("video");
  v.setAttribute("poster", LANG === "pt" ? "docs/demo-pt-poster.jpg" : "docs/demo-poster.jpg");
  if (v.dataset.iniciado && v.dataset.lang !== LANG) carregarVideo(false);
}
function carregarVideo(tocar) {
  const v = $("video-demo").querySelector("video"), pt = LANG === "pt";
  v.dataset.lang = LANG;
  v.pause();
  for (const trilha of v.querySelectorAll("track")) trilha.remove();
  v.src = pt ? "docs/demo-pt.mp4" : "docs/demo.mp4";
  if (/^https?:$/.test(location.protocol)) {
    v.append(el("track", { kind: "captions", srclang: pt ? "pt-BR" : "en", label: pt ? "Português" : "English", src: pt ? "docs/demo-pt.vtt" : "docs/demo.vtt" }));
  }
  if (tocar) v.play().catch(() => {});
}
$("video-play").addEventListener("click", () => {
  const v = $("video-demo").querySelector("video");
  v.dataset.iniciado = "1";
  v.controls = true;
  $("video-play").hidden = true;
  carregarVideo(true);
});

/* ---------- início ---------- */
(function iniciar() {
  aplicarIdioma();
  let pac = null;
  try { pac = JSON.parse($("pacote").textContent); } catch (e) {}
  if (pac && Array.isArray(pac.linhas) && Array.isArray(pac.colunas)) {
    S = { arquivo: pac.arquivo, planilha: pac.planilha || null, formato: pac.formato, delim: pac.delim, colunas: pac.colunas, linhas: pac.linhas, hash: pac.hash, pacote: true };
    S.config = mesclarConfig(pac.config);
    S.base = "p" + pac.hash + cyrb53(JSON.stringify(pac.config) + "|" + (pac.planilha || ""));
    telaNome();
  } else telaCarregar();
})();
</script>
